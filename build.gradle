plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    mavenCentral()
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com"
    }
    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    typescriptCompiler
}

dependencies {
    compileOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}:api"
    compileOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    localRuntime "org.appliedenergistics:appliedenergistics2:${ae2_version}"

   jarJar(implementation("org.graalvm.polyglot:polyglot:${graaljs_version}")) {
        version {
            strictly "[${graaljs_version}]"
        }
    }
    jarJar(implementation("org.graalvm.js:js-language:${graaljs_version}"))
    jarJar(implementation("org.graalvm.truffle:truffle-runtime:${graaljs_version}"))
    jarJar(implementation("org.graalvm.truffle:truffle-api:${graaljs_version}"))
    jarJar(implementation("org.graalvm.truffle:truffle-compiler:${graaljs_version}"))
    jarJar(implementation("org.graalvm.regex:regex:${graaljs_version}"))
    jarJar(implementation("org.graalvm.sdk:collections:${graaljs_version}"))
    jarJar(implementation("org.graalvm.sdk:jniutils:${graaljs_version}"))
    jarJar(implementation("org.graalvm.sdk:nativeimage:${graaljs_version}"))
    jarJar(implementation("org.graalvm.sdk:word:${graaljs_version}"))
    jarJar(implementation("org.graalvm.shadowed:icu4j:${graaljs_version}"))
    jarJar(implementation("org.graalvm.shadowed:xz:${graaljs_version}"))
    additionalRuntimeClasspath "org.graalvm.polyglot:js-community:${graaljs_version}"
    typescriptCompiler "org.webjars.npm:typescript:${typescript_version}"

    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Client-side recipe dump reuses ae2-jei-integration's ingredient-to-stack
    // converters (items/fluids built-in, chemicals via Applied Mekanistics).
    compileOnly "curse.maven:ae2-jei-integration-1074338:${ae2_jei_integration_file_id}"
    localRuntime "curse.maven:ae2-jei-integration-1074338:${ae2_jei_integration_file_id}"

    localRuntime "curse.maven:jade-324717:${jade_file_id}"

}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_description        : mod_description,
            ae2_version            : ae2_version,
            graaljs_version        : graaljs_version,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// include docs for conding agents
// Sync (not Copy) so files removed from appliedscripts are also removed from
// the packaged docs instead of lingering from earlier builds.
var generateDocs = tasks.register("generateDocs", Sync) {
    from("appliedscripts") {
        include "*"
        exclude "channels.json"
        exclude "processing_recipes.json"
        exclude "recipe_types.json"
        into "assets/appliedfactory/docs"
    }
    into "build/generated/docsResources"
}
sourceSets.main.resources.srcDir generateDocs
neoForge.ideSyncTask generateDocs

// ModLauncher exposes GraalJS classes from dependency jars, but not arbitrary
// WebJar resources through the transformed mod class loader. Copy the pinned
// compiler bundle into this mod's own resource namespace for both dev and production.
var generateTypescriptCompiler = tasks.register("generateTypescriptCompiler", Sync) {
    from({ configurations.typescriptCompiler.collect { zipTree(it) } }) {
        include "META-INF/resources/webjars/typescript/${typescript_version}/lib/typescript.js"
        eachFile { details ->
            details.path = "assets/appliedfactory/compiler/typescript.js"
        }
        includeEmptyDirs = false
    }
    into "build/generated/typescriptResources"
}
sourceSets.main.resources.srcDir generateTypescriptCompiler
neoForge.ideSyncTask generateTypescriptCompiler

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs.add('-Xlint:all')
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
